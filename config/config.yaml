# Cấu hình chung cho stillnessShorts (KHÔNG chứa secrets - secrets nằm trong .env)

input:
  # "video"  -> cắt short từ 1 video gốc dài (video_path)
  # "photos" -> dựng short từ ảnh (AI tự sinh, hoặc lấy từ photos_dir) + hiệu ứng Ken Burns
  mode: "photos"

  # Dùng khi mode = "video"
  video_path: "data/input/source_video.mp4"

  # Có thể là 1 file .mp3 duy nhất, HOẶC 1 thư mục chứa nhiều file .mp3 - khi đó các file
  # được ghép nối tuần tự theo TÊN FILE (sắp xếp alphabet, vd 01.mp3, 02.mp3, ...) thành
  # 1 timeline audio liên tục duy nhất.
  narration_path: "data/input/narration.mp3"
  # File nhạc nền tùy chọn - để trống hoặc xóa dòng này nếu không dùng
  music_path: "data/input/music.mp3"

output:
  dir: "data/output"
  work_dir: "data/work"          # thư mục tạm cho file trung gian (audio cắt, ass, v.v.)
  state_file: "data/state/state.json"

generation:
  count: 5                # số lượng short muốn tạo trong lần chạy này (--count có thể override)
  min_duration_sec: 30
  max_duration_sec: 60
  # true => nếu hết nội dung (video hoặc audio) thì dừng sớm thay vì lỗi
  stop_if_exhausted: true

video:
  width: 1080
  height: 1920             # 9:16
  fps: 30
  video_bitrate: "6M"
  audio_bitrate: "192k"
  crf: 20                  # dùng khi không set bitrate cố định (libx264 -crf)
  codec: "libx264"
  preset: "medium"
  # Tăng tốc phát video + audio (giữ nguyên cao độ giọng nói) để nhịp độ nhanh, gọn hơn.
  # 1.0 = tốc độ gốc. Độ dài video/audio thuyết minh dùng cho short KHÔNG đổi (vẫn theo
  # generation.min/max_duration_sec), chỉ thời lượng phát ra ngắn lại theo hệ số này
  # (ví dụ đoạn 40s với speed_factor 1.25 -> video xuất ra dài 32s).
  speed_factor: 1.25

photos:
  # Chỉ dùng khi input.mode = "photos".
  # "ai_generated" -> mỗi short tự sinh 1 ảnh bằng AI, dựa trên tiêu đề/ý chính của đoạn
  #                   thuyết minh dùng cho short đó (không cần chuẩn bị ảnh trước).
  # "folder"       -> lấy ảnh tuần tự từ photos_dir (mỗi short ghép nhiều ảnh liên tiếp
  #                   dạng slideshow, xem seconds_per_photo_min/max bên dưới).
  source: "ai_generated"

  # Dùng khi source = "folder": thư mục chứa ảnh (.jpg/.jpeg/.png/.webp/.bmp), dùng tuần tự
  # theo tên file, không lặp lại giữa các short.
  photos_dir: "data/input/photos"
  seconds_per_photo_min: 3.0
  seconds_per_photo_max: 6.0

  zoom_max: 1.15            # mức zoom tối đa (1.0 = không zoom), áp dụng cho cả 2 source
  alternate_direction: true # xen kẽ zoom-in / zoom-out giữa các ảnh/short cho đỡ đơn điệu

image_generation:
  # Chỉ dùng khi photos.source = "ai_generated".
  # "pollinations" -> miễn phí, không cần API key.
  # "openai"       -> chất lượng cao hơn, cần OPENAI_API_KEY, tính phí theo ảnh.
  provider: "pollinations"
  openai_model: "gpt-image-1"
  # Câu mô tả style thêm vào cuối mọi prompt để ảnh đồng nhất phong cách.
  style_suffix: "cinematic photography, high detail, natural lighting, no text, no watermark, no logo"
  timeout_sec: 60

audio_mix:
  # Âm lượng nhạc nền tương đối so với thuyết minh (0.0 - 1.0)
  music_volume: 0.15
  narration_volume: 1.0
  # Fade in/out cho nhạc nền (giây)
  music_fade_sec: 1.5

whisper:
  # faster-whisper model size: tiny/base/small/medium/large-v2/large-v3
  # medium/large-v3 cho kết quả tiếng Việt tốt hơn nhưng chậm và nặng hơn
  model_size: "medium"
  device: "auto"           # auto | cpu | cuda
  compute_type: "auto"     # auto | int8 | float16 | float32
  language: "vi"
  word_timestamps: true

subtitle:
  font_path: "assets/fonts/BeVietnamPro-ExtraBold.ttf"
  font_name: "Be Vietnam Pro ExtraBold"
  font_size: 72
  primary_color: "&H00FFFFFF"   # trắng (ASS format: &HAABBGGRR)
  outline_color: "&H00000000"   # viền đen
  back_color: "&H99000000"      # nền mờ phía sau chữ (ASS alpha+BGR)
  outline: 4
  shadow: 2
  alignment: 5              # ASS alignment 5 = middle-center
  margin_v: 0
  max_chars_per_line: 30
  max_words_per_caption: 6   # số từ tối đa mỗi cụm phụ đề hiển thị cùng lúc

branding:
  # Logo + tên kênh, hiển thị CỐ ĐỊNH suốt video (không theo timestamp), căn giữa màn hình,
  # nằm phía trên phụ đề. Đặt logo tại đường dẫn logo_path (PNG nền trong suốt là tốt nhất).
  enabled: true
  logo_path: "data/input/image.png"
  logo_height: 180      # px - chiều cao logo sau khi scale (giữ nguyên tỉ lệ khung hình)
  logo_top_y: 380        # px - toạ độ Y mép trên của logo (0 = trên cùng khung hình)
  gap_after_logo: 30     # px - khoảng cách từ đáy logo tới dòng chữ đầu tiên (@handle)
  line_spacing: 64       # px - khoảng cách giữa dòng @handle và dòng tên kênh
  channel_handle: "@StillnessNow"
  channel_name: "Tĩnh Lặng"
  handle_font_size: 40
  name_font_size: 56
  font_path: "assets/fonts/BeVietnamPro-ExtraBold.ttf"
  font_name: "Be Vietnam Pro ExtraBold"
  text_color: "&H00FFFFFF"      # trắng
  outline_color: "&H00000000"   # viền đen
  outline: 3
  shadow: 2

llm:
  # groq | claude | rule_based
  provider: "groq"
  groq_model: "openai/gpt-oss-120b"
  claude_model: "claude-sonnet-5"
  max_title_length: 90
  temperature: 0.6

youtube:
  playlist_id: ""            # điền YOUTUBE_PLAYLIST_ID hoặc set qua .env
  privacy_status: "public"   # public | unlisted | private (dùng khi publish_delay_minutes = 0)
  category_id: "22"          # People & Blogs (đổi tùy nội dung)
  default_tags:
    - "shorts"
    - "vietsub"
  made_for_kids: false
  # Số phút trì hoãn trước khi video công khai (lên lịch phát hành thay vì đăng ngay).
  # 0 = đăng ngay với privacy_status ở trên. > 0 = upload ở chế độ private kèm publishAt,
  # YouTube sẽ tự chuyển sang public đúng giờ (video không public trước thời điểm đó).
  publish_delay_minutes: 60

telegram:
  enabled: true
